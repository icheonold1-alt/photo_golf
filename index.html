<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>장수대학 평생교육 프로그램 사진 관리</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- JSZip & FileSaver -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-10">

  <!-- Toast Notification -->
  <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-slate-900/90 text-white text-xs px-4 py-2.5 rounded-full shadow-lg flex items-center gap-2 transition-all duration-300 opacity-0 pointer-events-none">
    <i id="toast-icon" class="fa-solid fa-spinner fa-spin text-emerald-400"></i>
    <span id="toast-msg">처리 중...</span>
  </div>

  <!-- Header -->
  <header class="bg-indigo-700 text-white sticky top-0 z-30 shadow-md">
    <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
      <div>
        <h1 class="font-bold text-lg flex items-center gap-2">
          <i class="fa-solid fa-camera"></i> 장수대학 수업사진 관리
        </h1>
        <div class="flex items-center gap-2 mt-0.5">
          <span class="text-xs text-indigo-200 font-bold" id="current-week-badge">주차 계산 중...</span>
          <span class="bg-emerald-500/30 border border-emerald-400/50 text-emerald-200 text-[10px] px-1.5 py-0.2 rounded font-semibold flex items-center gap-1">
            <i class="fa-solid fa-users"></i> 주간 동기화
          </span>
        </div>
      </div>
      
      <!-- Header Action Buttons -->
      <div class="flex items-center gap-1.5">
        <!-- ⛳ 골프 예약 조회 버튼 -->
        <button id="open-golf-btn" onclick="openGolfModal()" class="bg-emerald-600 hover:bg-emerald-700 border border-emerald-500 text-white text-xs font-bold px-2.5 py-1.5 rounded-xl flex items-center gap-1 transition shadow-sm">
          <i class="fa-solid fa-flag-checkered"></i> 골프 예약
        </button>

        <!-- Menu Button -->
        <button id="open-menu-btn" class="bg-indigo-800 hover:bg-indigo-900 border border-indigo-500 text-white text-xs font-bold px-3 py-1.5 rounded-xl flex items-center gap-1.5 transition">
          <i class="fa-solid fa-bars"></i> 메뉴
        </button>
      </div>
    </div>

    <!-- Archive Banner -->
    <div id="archive-banner" class="bg-amber-500 text-slate-900 px-4 py-1.5 text-xs font-bold text-center hidden flex items-center justify-center gap-2">
      <i class="fa-solid fa-box-archive"></i>
      <span id="archive-banner-text">[보관함]을 조회 중입니다.</span>
      <button onclick="exitArchiveView()" class="ml-2 bg-amber-700 text-white text-[10px] px-2 py-0.5 rounded-md hover:bg-amber-800">이번 주로 돌아가기</button>
    </div>

    <!-- Dual Progress Bar (이번 주 / 이번 달) -->
    <div id="progress-container" class="max-w-md mx-auto px-4 pb-3 pt-1 space-y-2">
      <!-- 이번 주 진척도 -->
      <div>
        <div class="flex justify-between text-xs font-semibold mb-1">
          <span id="progress-week-text">📅 이번 주 필수 촬영: 0 / 69 (0%)</span>
        </div>
        <div class="w-full bg-indigo-900 rounded-full h-2 overflow-hidden">
          <div id="progress-week-bar" class="bg-emerald-400 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
        </div>
      </div>

      <!-- 이번 달 진척도 -->
      <div>
        <div class="flex justify-between text-xs font-semibold mb-1">
          <span id="progress-month-text">🗓️ 이번 달 필수 촬영: 0 / 69 (0%)</span>
          <span id="warning-count-badge" class="text-[10px] bg-rose-500 text-white px-1.5 py-0.2 rounded font-bold">이번 달 0회 0개</span>
        </div>
        <div class="w-full bg-indigo-900 rounded-full h-2 overflow-hidden">
          <div id="progress-month-bar" class="bg-amber-400 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
        </div>
      </div>
    </div>

    <!-- Day Filter Tabs -->
    <div class="max-w-md mx-auto px-4 flex gap-2 overflow-x-auto hide-scrollbar pb-3">
      <button class="day-tab bg-indigo-600/70 text-white font-medium px-4 py-1.5 rounded-full text-xs shrink-0" data-day="월">월요일</button>
      <button class="day-tab bg-indigo-600/70 text-white font-medium px-4 py-1.5 rounded-full text-xs shrink-0" data-day="화">화요일</button>
      <button class="day-tab bg-indigo-600/70 text-white font-medium px-4 py-1.5 rounded-full text-xs shrink-0" data-day="수">수요일</button>
      <button class="day-tab bg-indigo-600/70 text-white font-medium px-4 py-1.5 rounded-full text-xs shrink-0" data-day="목">목요일</button>
      <button class="day-tab bg-indigo-600/70 text-white font-medium px-4 py-1.5 rounded-full text-xs shrink-0" data-day="금">금요일</button>
      <button class="day-tab bg-indigo-600/70 text-white font-medium px-4 py-1.5 rounded-full text-xs shrink-0" data-day="전체">전체</button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-md mx-auto px-4 pt-4">

    <!-- Search & Filter Bar -->
    <div class="mb-3 flex gap-2">
      <div class="relative flex-1">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-sm"></i>
        <input type="text" id="search-input" placeholder="수업명 또는 장소 검색..." class="w-full pl-9 pr-3 py-2 bg-white border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm">
      </div>
      <select id="status-filter" class="bg-white border border-slate-200 text-sm rounded-xl px-2 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm">
        <option value="all">전체 상태</option>
        <option value="danger">⚠️ 이번 달 0회 (긴급)</option>
        <option value="pending">미완료만</option>
        <option value="done">완료만</option>
        <option value="optional">선택사항(기타)</option>
      </select>
    </div>

    <!-- Info Banner -->
    <div class="mb-3 text-[11px] text-slate-500 flex items-center justify-between px-1">
      <span><i class="fa-solid fa-arrow-down-short-wide text-indigo-500 mr-1"></i>시간순 ➔ 낮은 층수순 정렬됨</span>
      <span class="text-slate-400">(주 1회 촬영 / 월 최소 1회 필수)</span>
    </div>

    <!-- Cards Container -->
    <div id="cards-container" class="space-y-3"></div>
  </main>

  <!-- Hidden Upload Inputs -->
  <input type="file" id="camera-input" accept="image/*" capture="environment" class="hidden">
  <input type="file" id="gallery-input" accept="image/*" class="hidden">

  <!-- Modal 1: Photo Upload Type Selection Sheet -->
  <div id="upload-type-modal" class="fixed inset-0 bg-black/60 z-50 flex items-end justify-center hidden backdrop-blur-xs">
    <div class="bg-white rounded-t-3xl w-full max-w-md p-5 space-y-3">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="font-bold text-slate-800 text-base">사진 등록 방식 선택</h3>
        <button onclick="closeUploadTypeModal()" class="text-slate-400 text-lg"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="grid grid-cols-2 gap-3 pt-1">
        <button id="choose-camera-btn" class="py-4 bg-indigo-50 hover:bg-indigo-100 border border-indigo-200 rounded-2xl flex flex-col items-center gap-2 text-indigo-700 font-bold transition">
          <i class="fa-solid fa-camera text-2xl"></i>
          <span class="text-xs">카메라로 바로 촬영</span>
        </button>
        <button id="choose-gallery-btn" class="py-4 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 rounded-2xl flex flex-col items-center gap-2 text-emerald-700 font-bold transition">
          <i class="fa-solid fa-images text-2xl"></i>
          <span class="text-xs">갤러리/앨범에서 선택</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Modal 2: Menu / Actions Modal -->
  <div id="menu-modal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 hidden backdrop-blur-xs">
    <div class="bg-white rounded-3xl w-full max-w-sm overflow-hidden shadow-2xl flex flex-col">
      <div class="p-4 bg-indigo-700 text-white flex justify-between items-center">
        <h3 class="font-bold text-base flex items-center gap-2">
          <i class="fa-solid fa-sliders"></i> 관리 및 주차별 보관함
        </h3>
        <button id="menu-close-btn" class="text-white/80 hover:text-white text-lg p-1">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      
      <div class="p-4 space-y-3">
        <!-- Week Selector Area -->
        <div class="bg-indigo-50 border border-indigo-100 p-3 rounded-2xl space-y-1.5">
          <label class="text-xs font-bold text-indigo-900 flex items-center gap-1.5">
            <i class="fa-solid fa-calendar-week text-indigo-600"></i> 주차 선택 및 보관함 이동
          </label>
          <select id="week-selector" class="w-full bg-white border border-indigo-200 text-xs font-bold rounded-xl px-3 py-2 text-indigo-900 focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <!-- Dynamically Populated -->
          </select>
          <button id="load-week-btn" class="w-full mt-1 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl text-xs transition">
            선택한 주차 조회하기
          </button>
        </div>

        <div class="bg-emerald-50 border border-emerald-100 p-3 rounded-2xl space-y-1.5">
          <label class="text-xs font-bold text-emerald-900 flex items-center gap-1.5">
            <i class="fa-solid fa-file-zipper text-emerald-600"></i> 월별 전체 사진 ZIP 다운로드
          </label>
          <div class="grid grid-cols-2 gap-2">
            <button id="zip-this-month-btn" class="py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs transition">
              <span id="zip-this-month-label">이번 달</span>
            </button>
            <button id="zip-last-month-btn" class="py-2.5 bg-emerald-100 hover:bg-emerald-200 text-emerald-800 border border-emerald-300 font-bold rounded-xl text-xs transition">
              <span id="zip-last-month-label">지난 달</span>
            </button>
          </div>
        </div>

        <button id="menu-sync-btn" class="w-full py-2.5 px-4 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-2xl text-xs flex items-center justify-between transition">
          <span class="flex items-center gap-2"><i class="fa-solid fa-rotate text-indigo-600"></i> 구글 드라이브 동기화</span>
          <i class="fa-solid fa-chevron-right text-xs opacity-50"></i>
        </button>

        <button id="menu-reset-btn" class="w-full py-2.5 px-4 bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold rounded-2xl text-xs flex items-center justify-between transition border border-rose-100">
          <span class="flex items-center gap-2"><i class="fa-solid fa-trash-can"></i> 이번 주 사진 전체 리셋</span>
          <i class="fa-solid fa-triangle-exclamation text-xs opacity-70"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Modal 3: Photo Preview Modal -->
  <div id="photo-modal" class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 hidden backdrop-blur-sm">
    <div class="bg-white rounded-3xl w-full max-w-sm overflow-hidden shadow-2xl flex flex-col">
      <div class="p-4 bg-slate-900 text-white flex justify-between items-center">
        <div>
          <h4 id="modal-title" class="font-bold text-sm">수업 정보</h4>
          <p id="modal-date" class="text-xs text-slate-400 font-mono">촬영 및 동기화 상태</p>
        </div>
        <button id="modal-close-btn" class="text-slate-400 hover:text-white text-lg p-1">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="relative bg-slate-950 flex items-center justify-center min-h-[240px] max-h-[60vh] overflow-hidden">
        <img id="modal-img" src="" alt="등록 사진 미리보기" class="max-w-full max-h-[55vh] object-contain">
      </div>

      <div class="p-4 bg-white border-t border-slate-100 flex gap-2">
        <button id="modal-retake-btn" class="flex-1 py-2.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold rounded-xl text-xs flex items-center justify-center gap-1.5 border border-indigo-200">
          <i class="fa-solid fa-camera"></i> 다시 등록하기
        </button>
        <button id="modal-delete-btn" class="py-2.5 px-4 bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold rounded-xl text-xs flex items-center justify-center gap-1 border border-rose-200">
          <i class="fa-solid fa-trash-can"></i> 드라이브에서 삭제
        </button>
      </div>
    </div>
  </div>

  <!-- Modal 4: 스크린 파크골프 예약 명단 조회 팝업 -->
  <div id="golf-modal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 hidden backdrop-blur-xs">
    <div class="bg-white rounded-3xl w-full max-w-md max-h-[85vh] overflow-hidden shadow-2xl flex flex-col">
      <!-- Modal Header -->
      <div class="p-4 bg-emerald-700 text-white flex justify-between items-center shadow-sm">
        <div>
          <h3 class="font-bold text-base flex items-center gap-2">
            <i class="fa-solid fa-golf-ball-tee"></i> 스크린파크골프 예약 명단
          </h3>
          <p id="golf-date-badge" class="text-[11px] text-emerald-200 mt-0.5">날짜 로딩 중...</p>
        </div>
        <div class="flex items-center gap-1">
          <button onclick="fetchGolfReservations()" class="bg-emerald-800 hover:bg-emerald-900 text-white text-xs p-2 rounded-xl transition" title="새로고침">
            <i class="fa-solid fa-rotate"></i>
          </button>
          <button onclick="closeGolfModal()" class="text-white/80 hover:text-white text-lg p-1 ml-1">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
      </div>
      
      <!-- Modal Body (명단 표시 영역) -->
      <div id="golf-list-container" class="p-4 space-y-3 overflow-y-auto max-h-[calc(85vh-70px)] bg-slate-50">
        <div class="text-center py-8 text-slate-400 text-sm">
          <i class="fa-solid fa-spinner fa-spin text-2xl mb-2 text-emerald-600"></i>
          <p>명단을 불러오는 중입니다...</p>
        </div>
      </div>
    </div>
  </div>

    function getFloorLevel(location) {
      if (location.includes("지하1층")) return -1;
      if (location.includes("서예실") || location.includes("ICT지식마루") || location.includes("1층")) return 1;
      if (location.includes("2층")) return 2;
      if (location.includes("3층")) return 3;
      return 99;
    }

    function getStartMinutes(timeStr) {
      const start = timeStr.split('~')[0].trim();
      const [h, m] = start.split(':').map(Number);
      return (h * 60) + (m || 0);
    }

    function getMonthWeekKey(d = new Date()) {
      const target = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      const year = target.getFullYear();
      const month = target.getMonth() + 1;
      
      const firstDayOfMonth = new Date(year, target.getMonth(), 1);
      const dayOfWeekOfFirst = firstDayOfMonth.getDay();
      
      const currentDate = target.getDate();
      let weekNum = Math.ceil((currentDate + (dayOfWeekOfFirst === 0 ? 6 : dayOfWeekOfFirst - 1)) / 7);

      return `${year}-${month}-W${String(weekNum).padStart(2, '0')}`;
    }

    function formatWeekTitle(weekKey) {
      if (!weekKey) return "주차 정보 없음";
      const parts = weekKey.split('-');
      if (parts.length < 3) return weekKey;
      const year = parts[0];
      const month = parseInt(parts[1], 10);
      const week = parseInt(parts[2].replace('W', ''), 10);
      return `${year}년 ${month}월 ${week}주차`;
    }

    function calculateClassDateStr(weekKey, dayStr) {
      if (!weekKey || !weekKey.includes('-W')) {
        const now = new Date();
        return `${now.getMonth() + 1}.${String(now.getDate()).padStart(2, '0')}`;
      }

      const parts = weekKey.split('-');
      const year = parseInt(parts[0], 10);
      const month = parseInt(parts[1], 10);
      const weekNum = parseInt(parts[2].replace('W', ''), 10);

      const firstDay = new Date(year, month - 1, 1);
      let firstDayOfWeek = firstDay.getDay();
      if (firstDayOfWeek === 0) firstDayOfWeek = 7;

      const firstMondayDateNum = 1 - (firstDayOfWeek - 1);
      const targetMondayDateNum = firstMondayDateNum + (weekNum - 1) * 7;

      const dayMap = { "월": 0, "화": 1, "수": 2, "목": 3, "금": 4 };
      const addDays = dayMap[dayStr] !== undefined ? dayMap[dayStr] : 0;

      const targetDate = new Date(year, month - 1, targetMondayDateNum + addDays);

      return `${targetDate.getMonth() + 1}.${String(targetDate.getDate()).padStart(2, '0')}`;
    }

    function inferDateFromMD(month, day) {
      const now = new Date();
      let d = new Date(now.getFullYear(), month - 1, day);
      if (d.getTime() - now.getTime() > 45 * 24 * 60 * 60 * 1000) {
        d = new Date(now.getFullYear() - 1, month - 1, day);
      }
      return d;
    }

    function parseFileDate(fileName) {
      const m = /^(\d{1,2})\.(\d{1,2})_/.exec(fileName || "");
      if (!m) return null;
      const month = Number(m[1]), day = Number(m[2]);
      if (month < 1 || month > 12 || day < 1 || day > 31) return null;
      return inferDateFromMD(month, day);
    }

    function calculateWeekFromDateStr(dateStr) {
      if (!dateStr || !dateStr.includes('.')) return getMonthWeekKey();
      const [month, day] = dateStr.split('.').map(Number);
      return getMonthWeekKey(inferDateFromMD(month, day));
    }

    function parseWeekKey(weekKey) {
      const p = weekKey.split('-');
      return { year: parseInt(p[0], 10), month: parseInt(p[1], 10), week: parseInt(p[2].replace('W', ''), 10) };
    }

    function monthKeyOf(date) {
      return `${date.getFullYear()}-${date.getMonth() + 1}`;
    }

    function shiftMonth(year, month, delta) {
      const d = new Date(year, month - 1 + delta, 1);
      return { year: d.getFullYear(), month: d.getMonth() + 1 };
    }

    function getWeekOfDate(date) {
      return parseInt(getMonthWeekKey(date).split('-W')[1], 10);
    }

    function getWeeksInMonth(year, month) {
      const d = new Date(year, month, 0);
      while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() - 1);
      return getWeekOfDate(d);
    }

    const matchCache = new Map();
    function matchProgram(fileName) {
      if (matchCache.has(fileName)) return matchCache.get(fileName);
      const result = matchProgramUncached(fileName);
      matchCache.set(fileName, result);
      return result;
    }

    function matchProgramUncached(fileName) {
      const base = (fileName || "").replace(/^\d{1,2}\.\d{1,2}_/, '').replace(/\.[^.]+$/, '');
      let candidates = rawData.filter(d => d.name === base);
      if (candidates.length === 0) candidates = rawData.filter(d => (fileName || "").includes(d.name));
      if (candidates.length <= 1) return candidates[0] || null;
      const date = parseFileDate(fileName);
      if (date) {
        const dayChar = ['일', '월', '화', '수', '목', '금', '토'][date.getDay()];
        const byDay = candidates.find(d => d.day === dayChar);
        if (byDay) return byDay;
      }
      return candidates[0];
    }

    async function checkAndAutoArchiveWeekly() {
      const realCurrentWeekKey = getMonthWeekKey();
      const savedWeekObj = await getMetaDB("currentWeek");
      const savedWeek = savedWeekObj ? savedWeekObj.value : null;

      if (savedWeek && savedWeek !== realCurrentWeekKey) {

        showToast(`🎉 새로운 주차(${formatWeekTitle(realCurrentWeekKey)})가 시작되었습니다.`);
      } else if (!savedWeek) {
        await putDB("meta", { key: "currentWeek", value: realCurrentWeekKey });

      document.getElementById('current-week-badge').innerText = formatWeekTitle(realCurrentWeekKey);

    const DELETE_GRACE_MS = 2 * 60 * 1000;
    let pendingDeletes = {};

    function savePendingDeletes() {
      putDB("meta", { key: "pendingDeletes", value: pendingDeletes });
    }

    function addPendingDelete(name) {
      pendingDeletes[name] = Date.now();
      savePendingDeletes();
    }

    function removePendingDelete(name) {
      delete pendingDeletes[name];
      savePendingDeletes();
    }

    function applyPendingDeletes(fileList) {
      const names = Object.keys(pendingDeletes);
      if (names.length === 0) return fileList;
      const present = new Set(fileList.map(f => f.name));
      const hide = new Set();
      let changed = false;
      names.forEach(name => {
        const expired = Date.now() - pendingDeletes[name] > DELETE_GRACE_MS;
        if (!present.has(name) || expired) { delete pendingDeletes[name]; changed = true; }
        else hide.add(name);
      });
      if (changed) savePendingDeletes();
      return hide.size ? fileList.filter(f => !hide.has(f.name)) : fileList;
    }

    const deleteQueue = [];
    const queuedDeleteNames = new Set();
    let deleteRunning = false;
    let resyncTimer = null;

    function enqueueDelete(name, driveFolder = "") {
      if (queuedDeleteNames.has(name)) return;
      queuedDeleteNames.add(name);
      deleteQueue.push({ name, driveFolder });
      runDeleteQueue();
    }

    async function sendDeleteWithRetry(name, driveFolder = "") {
      const url = `${GAS_URL}?action=delete&targetKey=${encodeURIComponent(name)}` + (driveFolder ? `&driveFolder=${encodeURIComponent(driveFolder)}` : "");
      for (let attempt = 1; attempt <= 3; attempt++) {
        try {
          const res = await fetch(url, { method: 'GET' });
          const json = await res.json();
          if (json && json.result === "success") return true;
        } catch (err) {
          console.warn(`드라이브 삭제 재시도 (${attempt}/3):`, name, err);
        }
        await new Promise(r => setTimeout(r, 1000 * attempt));
      }
      return false;
    }

    async function runDeleteQueue() {
      if (deleteRunning) return;
      deleteRunning = true;
      let failedCount = 0;
      while (deleteQueue.length > 0) {
        const { name, driveFolder } = deleteQueue.shift();
        showToast(`드라이브에서 삭제 중... (남은 ${deleteQueue.length + 1}장)`, true, 60000);
        const ok = await sendDeleteWithRetry(name, driveFolder);
        queuedDeleteNames.delete(name);
        if (!ok) {
          failedCount++;
          removePendingDelete(name);
        }
      }
      deleteRunning = false;
      showToast(failedCount ? `${failedCount}장은 삭제하지 못했어요. 다시 표시됩니다` : "드라이브 삭제 완료!", false, 4000);

      clearTimeout(resyncTimer);
      resyncTimer = setTimeout(() => fetchRemoteDrivePhotos().then(renderApp), failedCount ? 500 : 5000);
    }

    let syncInFlight = null;
    function fetchRemoteDrivePhotos() {
      if (syncInFlight) return syncInFlight;
      syncInFlight = doFetchRemoteDrivePhotos().finally(() => { syncInFlight = null; });
      return syncInFlight;
    }

    async function doFetchRemoteDrivePhotos() {
      try {
        showToast("구글 드라이브 최신 사진 동기화 중...");
        const nowDate = new Date();
        const prevM = shiftMonth(nowDate.getFullYear(), nowDate.getMonth() + 1, -1);
        const monthsParam = `${prevM.year}-${prevM.month},${nowDate.getFullYear()}-${nowDate.getMonth() + 1}`;
        const res = await fetch(`${GAS_URL}?months=${monthsParam}&t=${Date.now()}`);
        if (!res.ok) throw new Error("서버 응답 오류");
        const rawList = await res.json();
        if (!Array.isArray(rawList)) throw new Error("목록 형식 오류");
        const fileList = applyPendingDeletes(rawList);

        setRemoteFileList(fileList);
        putDB("meta", { key: "remoteList", value: fileList });

        const realCurrentWeekKey = getMonthWeekKey();
        const [curPhotos, archPhotos] = await Promise.all([getAllDB("photos"), getAllDB("archive_photos")]);
        const curIds = new Set(curPhotos.map(p => p.id));
        const archIds = new Set(archPhotos.map(p => p.id));
        const newCur = [];
        const newArch = [];

        for (const file of fileList) {
          const info = matchProgram(file.name);
          if (!info) continue;
          const pid = info.id;
          const driveImgUrl = `https://lh3.googleusercontent.com/d/${file.id}`;
          const nameDatePart = file.name.split('_')[0];
          const fileWeekKey = calculateWeekFromDateStr(nameDatePart);
          const dateStr = `${nameDatePart} (드라이브동기화)`;

          if (fileWeekKey === realCurrentWeekKey) {
            if (!curIds.has(pid)) {
              curIds.add(pid);
              newCur.push({ id: pid, dataUrl: driveImgUrl, dateStr, driveId: file.id, fileName: file.name, weekKey: fileWeekKey });
            }
          } else {
            const archiveId = `${fileWeekKey}_${pid}`;
            if (!archIds.has(archiveId)) {
              archIds.add(archiveId);
              newArch.push({ id: archiveId, originalId: pid, dataUrl: driveImgUrl, dateStr, driveId: file.id, fileName: file.name, archiveWeek: fileWeekKey });
            }
          }
        }

        await Promise.all([putManyDB("photos", newCur), putManyDB("archive_photos", newArch)]);
        showToast("동기화 완료!", false);
      } catch (err) {
        console.warn("드라이브 동기화 참고:", err);
      }
    }

    function populateWeekSelector() {
      const selector = document.getElementById('week-selector');
      selector.innerHTML = '';

      const now = new Date();
      const currentWeekKey = getMonthWeekKey(now);
      const thisM = { year: now.getFullYear(), month: now.getMonth() + 1, label: '이번 달' };
      const lastM = { ...shiftMonth(thisM.year, thisM.month, -1), label: '지난 달' };

      [thisM, lastM].forEach(m => {
        const group = document.createElement('optgroup');
        group.label = `${m.label} (${m.year}년 ${m.month}월)`;

        let weekCount = getWeeksInMonth(m.year, m.month);
        if (m === thisM) weekCount = Math.max(weekCount, parseWeekKey(currentWeekKey).week);

        for (let w = 1; w <= weekCount; w++) {
          const key = `${m.year}-${m.month}-W${String(w).padStart(2, '0')}`;
          const opt = document.createElement('option');
          opt.value = key;
          opt.innerText = formatWeekTitle(key) + (key === currentWeekKey ? " (현재 이번 주)" : "");
          if (key === currentViewingWeek) opt.selected = true;
          group.appendChild(opt);
        }
        selector.appendChild(group);
      });
    }

    let toastTimer = null;
    function showToast(msg, isLoading = true, duration = 2500) {
      const toast = document.getElementById('toast');
      const icon = document.getElementById('toast-icon');
      const text = document.getElementById('toast-msg');

      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');

    function compressImageFile(file, maxWidth = 1280, quality = 0.75) {
      return new Promise((resolve, reject) => {
        const objectUrl = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          let width = img.width;
          let height = img.height;
          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          URL.revokeObjectURL(objectUrl);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = () => { URL.revokeObjectURL(objectUrl); reject(new Error("이미지 로드 실패")); };
        img.src = objectUrl;
      });
    }

    function getMetaDB(key) {
      return new Promise((resolve) => {
        const tx = db.transaction("meta", "readonly");
        const req = tx.objectStore("meta").get(key);
        req.onsuccess = () => resolve(req.result);
      });
    }

    function getPhotoDB(storeName, id) {
      return new Promise((resolve) => {
        const tx = db.transaction(storeName, "readonly");
        const req = tx.objectStore(storeName).get(id);
        req.onsuccess = () => resolve(req.result);
      });
    }

    const dbCache = {};
    const CACHED_STORES = ["photos", "archive_photos"];

    function cacheUpsert(storeName, item) {
      const list = dbCache[storeName];
      if (!list) return;
      const idx = list.findIndex(x => x.id === item.id);
      if (idx >= 0) list[idx] = item; else list.push(item);
    }

    function putDB(storeName, item) {
      return new Promise((resolve) => {
        const tx = db.transaction(storeName, "readwrite");
        tx.objectStore(storeName).put(item);
        tx.oncomplete = () => {
          if (CACHED_STORES.includes(storeName)) cacheUpsert(storeName, item);
          resolve();
        };
      });
    }

    function putManyDB(storeName, items) {
      if (!items.length) return Promise.resolve();
      return new Promise((resolve) => {
        const tx = db.transaction(storeName, "readwrite");
        const store = tx.objectStore(storeName);
        items.forEach(item => store.put(item));
        tx.oncomplete = () => {
          if (CACHED_STORES.includes(storeName)) items.forEach(item => cacheUpsert(storeName, item));
          resolve();
        };
      });
    }

    function getAllDB(storeName) {
      if (dbCache[storeName]) return Promise.resolve(dbCache[storeName].slice());
      return new Promise((resolve) => {
        const tx = db.transaction(storeName, "readonly");
        const req = tx.objectStore(storeName).getAll();
        req.onsuccess = () => {
          const result = req.result || [];
          if (CACHED_STORES.includes(storeName)) dbCache[storeName] = result;
          resolve(result.slice());
        };
      });
    }

    function deleteDB(storeName, id) {
      return new Promise((resolve) => {
        const tx = db.transaction(storeName, "readwrite");
        tx.objectStore(storeName).delete(id);
        tx.oncomplete = () => {
          if (dbCache[storeName]) dbCache[storeName] = dbCache[storeName].filter(x => x.id !== id);
          resolve();
        };
      });
    }

    function clearDB(storeName) {
      return new Promise((resolve) => {
        const tx = db.transaction(storeName, "readwrite");
        tx.objectStore(storeName).clear();
        tx.oncomplete = () => {
          if (dbCache[storeName]) dbCache[storeName] = [];
          resolve();
        };
      });
    }

    let monthlyCountCache = { key: null, map: null };
    function getMonthlyCountMap(viewingMonthKey) {
      const cacheKey = `${remoteVersion}|${viewingMonthKey}`;
      if (monthlyCountCache.key === cacheKey) return monthlyCountCache.map;
      const map = new Map();
      remoteFileListCache.forEach(file => {
        const fileDate = parseFileDate(file.name);
        if (!fileDate || monthKeyOf(fileDate) !== viewingMonthKey) return;
        const item = matchProgram(file.name);
        if (item) map.set(item.id, (map.get(item.id) || 0) + 1);
      });
      monthlyCountCache = { key: cacheKey, map };
      return map;
    }

    async function handleFileSelected(file) {
      if (!file || !activeTargetId) return;
      const targetId = activeTargetId;
      activeTargetId = null;
      const info = rawData.find(r => r.id === targetId);
      if (!info) return;

      showToast("이미지 압축 중...");
      let compressedDataUrl;
      try {
        compressedDataUrl = await compressImageFile(file);
      } catch (err) {
        showToast("이미지를 불러오지 못했습니다", false);
        return;
      }

      const now = new Date();
      const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

      const uploadWeek = currentViewingWeek;
      const calculatedDateStr = calculateClassDateStr(uploadWeek, info.day);
      const fileName = `${calculatedDateStr}_${info.name}.jpg`;
      const dateStr = `${calculatedDateStr} ${timeStr}`;

      if (isArchiveView) {
        await putDB("archive_photos", {
          id: `${uploadWeek}_${targetId}`,
          originalId: targetId,
          dataUrl: compressedDataUrl,
          dateStr,
          fileName,
          archiveWeek: uploadWeek
        });
      } else {
        await putDB("photos", { id: targetId, dataUrl: compressedDataUrl, dateStr, fileName, weekKey: getMonthWeekKey() });
      }

      if (pendingDeletes[fileName]) removePendingDelete(fileName);

      if (!remoteFileListCache.some(f => f.name === fileName)) {
        setRemoteFileList([...remoteFileListCache, { name: fileName, id: "", folder: "" }]);
      }
      renderApp();

      showToast("구글 드라이브 전송 중...", true, 60000);
      try {
        await fetch(GAS_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ fileName: fileName, programName: info.name, driveFolder: info.driveFolder || "", dataUrl: compressedDataUrl })
        });
        showToast("드라이브 저장 완료!", false);
      } catch (err) {
        console.warn("드라이브 전송 완료:", err);
      }

      fetchRemoteDrivePhotos().then(renderApp);
    }

    function scrollToCurrentTimeSlot() {
      if (activeDay === "전체" || isArchiveView) return;
      const cards = [...document.querySelectorAll('#cards-container > div[data-start]')];
      if (cards.length === 0) return;

      const now = new Date();
      const limit = now.getHours() * 60 + now.getMinutes() + 10;
      const starts = [...new Set(cards.map(c => Number(c.dataset.start)))].sort((a, b) => a - b);
      const slot = starts.filter(t => t <= limit).pop() ?? starts[0];
      const target = cards.find(c => Number(c.dataset.start) === slot);
      if (!target || target === cards[0]) return;

      const headerHeight = document.querySelector('header').offsetHeight;
      const top = target.getBoundingClientRect().top + window.scrollY - headerHeight - 8;
      window.scrollTo({ top: Math.max(0, top), behavior: 'auto' });
    }

      const { year, month } = getMonthTarget(which);
      const monthKey = `${year}-${month}`;

      showToast(`${month}월 사진 목록 확인 중...`, true, 60000);
      await fetchRemoteDrivePhotos();

      const targets = new Map();
      remoteFileListCache.forEach(f => {
        const d = parseFileDate(f.name);
        if (d && monthKeyOf(d) === monthKey) targets.set(f.name, { fileName: f.name, driveId: f.id });
      });
      const list = [...targets.values()];

      if (list.length === 0) {
        showToast("확인 완료", false);
        alert(`${month}월에 다운로드할 사진이 없습니다!`);
        return;
      }

      const [curPhotos, archPhotos] = await Promise.all([getAllDB("photos"), getAllDB("archive_photos")]);
      const localByName = new Map();
      [...curPhotos, ...archPhotos].forEach(p => {
        if (p.fileName && p.dataUrl && p.dataUrl.startsWith("data:image")) localByName.set(p.fileName, p.dataUrl);
      });

      async function getPhotoContent(t) {
        const local = localByName.get(t.fileName);
        if (local) return { data: local.split(',')[1], options: { base64: true } };
        try {
          const r = await fetch(`https://lh3.googleusercontent.com/d/${t.driveId}`);
          if (!r.ok) throw new Error("HTTP " + r.status);
          return { data: await r.blob(), options: {} };
        } catch (e1) {
          const r2 = await fetch(`${GAS_URL}?action=getFile&id=${encodeURIComponent(t.driveId)}`);
          const j = await r2.json();
          if (!j.base64) throw new Error(j.error || "getFile 실패");
          return { data: j.base64, options: { base64: true } };
        }
      }

      const zip = new JSZip();
      const rootFolder = zip.folder(`장수대학_${year}년_${month}월_수업사진`);
      let done = 0, failed = 0, idx = 0;

      async function worker() {
        while (idx < list.length) {
          const t = list[idx++];
          try {
            const { data, options } = await getPhotoContent(t);
            const d = parseFileDate(t.fileName);
            const prog = matchProgram(t.fileName);
            const subName = (prog && prog.driveFolder) ? prog.driveFolder : `${d.getMonth() + 1}월 ${getWeekOfDate(d)}주차`;
            rootFolder.folder(subName).file(t.fileName, data, options);
          } catch (err) {
            failed++;
            console.warn("ZIP 제외:", t.fileName, err);
          }
          done++;
          showToast(`ZIP 준비 중... (${done}/${list.length})`, true, 60000);
        }
      }
      await Promise.all(Array.from({ length: 5 }, worker));

      if (failed === list.length) {
        showToast("ZIP 생성 실패", false);
        alert('사진을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.');
        return;
      }

      showToast("ZIP 파일 생성 중...", true, 60000);
      const content = await zip.generateAsync({ type: "blob" });
      saveAs(content, `장수대학_${year}년_${month}월_사진.zip`);
      showToast(failed ? `ZIP 다운로드 시작! (${failed}장 제외됨)` : "ZIP 다운로드 시작!", false);
    }

    document.getElementById('zip-this-month-btn').addEventListener('click', () => downloadMonthZip('this'));
    document.getElementById('zip-last-month-btn').addEventListener('click', () => downloadMonthZip('last'));

    // ==========================================
    // ⛳ 스크린 파크골프 예약 명단 조회 관련 로직
    // ==========================================
    // 명단은 복지관 PC(golf_sync.py)가 엔컴에서 읽어 Apps Script 에 올려 두고, 여기서는 그것을 불러온다.
    // 사진 관리와 같은 Apps Script 주소(GAS_URL)를 그대로 쓴다.
    const GOLF_API_URL = GAS_URL + "?action=golf";
    const GOLF_STALE_MINUTES = 20;   // 이보다 오래 갱신이 없으면 경고 표시

    function openGolfModal() {
      document.getElementById('golf-modal').classList.remove('hidden');
      fetchGolfReservations();
    }

    function closeGolfModal() {
      document.getElementById('golf-modal').classList.add('hidden');
    }

function formatKstTime(date) {
  return date.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Seoul' });
}

async function fetchGolfReservations() {
  const container = document.getElementById('golf-list-container');
  const dateBadge = document.getElementById('golf-date-badge');

  container.innerHTML = `
    <div class="text-center py-8 text-slate-400 text-sm">
      <i class="fa-solid fa-spinner fa-spin text-2xl mb-2 text-emerald-600"></i>
      <p>예약 명단을 불러오는 중...</p>
    </div>
  `;

  try {
    const response = await fetch(GOLF_API_URL + "&t=" + Date.now());
    if (!response.ok) throw new Error("서버 응답 에러");

    const result = await response.json();

    // 백엔드(GAS)에서 에러 객체를 반환한 경우
    if (result.error) {
      dateBadge.innerText = "조회 실패";
      container.innerHTML = `
        <div class="bg-rose-50 border border-rose-200 rounded-2xl p-5 text-center text-rose-700">
          <i class="fa-solid fa-triangle-exclamation text-3xl mb-2 text-rose-500"></i>
          <p class="text-xs font-bold mb-1">백엔드 오류 발생</p>
          <p class="text-[11px] text-rose-600 bg-rose-100 p-2 rounded-lg font-mono break-all">${result.message || JSON.stringify(result)}</p>
        </div>
      `;
      return;
    }

    // 날짜 + 마지막 갱신 시각
    const updated = result.updatedAt ? new Date(result.updatedAt) : null;
    const ageMin = (updated && !isNaN(updated)) ? Math.max(0, Math.round((Date.now() - updated.getTime()) / 60000)) : null;
    dateBadge.innerText = `조회 날짜: ${result.date || '날짜 미지정'}` + (ageMin !== null ? ` · 마지막 갱신 ${formatKstTime(updated)}` : '');

    // 안내 배너: 한 번도 못 받았거나, 오래 갱신이 없을 때
    let notice = '';
    if (!result.updatedAt) {
      notice = `
        <div class="bg-amber-50 border border-amber-200 text-amber-800 rounded-xl p-3 text-[11px] leading-relaxed flex gap-2">
          <i class="fa-solid fa-circle-info mt-0.5"></i>
          <span>아직 복지관 PC에서 올린 명단이 없습니다. PC의 동기화 프로그램이 켜져 있는지 확인해 주세요.</span>
        </div>`;
    } else if (ageMin !== null && ageMin >= GOLF_STALE_MINUTES) {
      notice = `
        <div class="bg-amber-50 border border-amber-200 text-amber-800 rounded-xl p-3 text-[11px] leading-relaxed flex gap-2">
          <i class="fa-solid fa-triangle-exclamation mt-0.5"></i>
          <span>마지막 갱신이 <b>${ageMin >= 60 ? Math.floor(ageMin / 60) + '시간 ' + (ageMin % 60) + '분' : ageMin + '분'} 전</b>입니다. 복지관 PC가 꺼져 있거나 동기화 프로그램이 멈췄을 수 있어 명단이 최신이 아닐 수 있어요.</span>
        </div>`;
    }

    if (!result.data || result.data.length === 0) {
      container.innerHTML = notice + `
        <div class="bg-white rounded-2xl p-6 text-center text-slate-400 border border-slate-200">
          <i class="fa-solid fa-calendar-xmark text-3xl mb-2 text-slate-300"></i>
          <p class="text-sm font-semibold">${result.updatedAt ? '예약된 명단이 없습니다.' : '불러온 명단이 없습니다.'}</p>
        </div>
      `;
      return;
    }

    container.innerHTML = notice;

    result.data.forEach(slot => {
      const card = document.createElement('div');
      card.className = "bg-white rounded-2xl p-3.5 shadow-sm border border-slate-200 space-y-2";

      const renderMembers = (members) => {
        if (!members || members.length === 0 || members[0] === "예약 없음") {
          return `<span class="text-xs text-slate-400 font-medium">예약 없음</span>`;
        }
        return members.map(m => `
          <span class="inline-block bg-emerald-50 border border-emerald-200 text-emerald-800 text-xs font-bold px-2 py-0.5 rounded-md">
            ${m}
          </span>
        `).join(' ');
      };

      card.innerHTML = `
        <div class="flex items-center justify-between border-b border-slate-100 pb-2">
          <span class="font-bold text-sm text-slate-800 flex items-center gap-1.5">
            <i class="fa-regular fa-clock text-emerald-600"></i> ${slot.time}
          </span>
        </div>

        <div class="grid grid-cols-2 gap-2 pt-0.5">
          <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100">
            <div class="text-[11px] font-bold text-slate-500 mb-1 flex items-center gap-1">
              <span class="w-2 h-2 rounded-full bg-indigo-500"></span> 1번 타석
            </div>
            <div class="flex flex-wrap gap-1">
              ${renderMembers(slot.court1)}
            </div>
          </div>

          <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100">
            <div class="text-[11px] font-bold text-slate-500 mb-1 flex items-center gap-1">
              <span class="w-2 h-2 rounded-full bg-emerald-500"></span> 2번 타석
            </div>
            <div class="flex flex-wrap gap-1">
              ${renderMembers(slot.court2)}
            </div>
          </div>
        </div>
      `;
      container.appendChild(card);
    });

  } catch (error) {
    console.error("골프 명단 불러오기 실패:", error);
    dateBadge.innerText = "통신 에러";
    container.innerHTML = `
      <div class="bg-rose-50 border border-rose-200 rounded-2xl p-6 text-center text-rose-700">
        <i class="fa-solid fa-circle-exclamation text-3xl mb-2 text-rose-500"></i>
        <p class="text-xs font-bold">명단을 불러오지 못했습니다.</p>
        <p class="text-[11px] text-rose-500 mt-1">GAS 웹 앱 응답에 실패했습니다.</p>
      </div>
    `;
  }
}
  </script>
</body>
